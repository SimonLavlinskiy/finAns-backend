basePath: /
definitions:
  domain.PlannerIncome:
    properties:
      amount:
        type: integer
      name:
        type: string
    type: object
  dto.AcceptedTransactionResponse:
    properties:
      amount:
        type: integer
      category:
        type: string
      comment:
        type: string
      date:
        type: string
      id:
        type: integer
      specificity:
        type: string
      tag_id:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  dto.AnalyticsRangeResponse:
    properties:
      current_month:
        type: string
      first_month:
        type: string
      today:
        description: YYYY-MM-DD в часовом поясе приложения
        type: string
      years:
        items:
          type: integer
        type: array
    type: object
  dto.CreatePlannedExpenseCategoryRequest:
    properties:
      color:
        type: string
      name:
        type: string
    type: object
  dto.CreatePlannedExpenseRequest:
    properties:
      category_id:
        type: integer
      cost_kopecks:
        type: integer
      due_date:
        type: string
      new_category:
        $ref: '#/definitions/dto.CreatePlannedExpenseCategoryRequest'
      priority:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  dto.HealthResponse:
    properties:
      db:
        type: string
      status:
        type: string
      version:
        type: string
    type: object
  dto.ImportBatchResponse:
    properties:
      closed_at:
        type: string
      created_at:
        type: string
      file_name:
        type: string
      id:
        type: integer
      status:
        type: string
      total_rows:
        type: integer
    type: object
  dto.ImportBatchWithRowsResponse:
    properties:
      batch:
        $ref: '#/definitions/dto.ImportBatchResponse'
      rows:
        items:
          $ref: '#/definitions/dto.ModerationRowResponse'
        type: array
    type: object
  dto.ModerationRowResponse:
    properties:
      amount:
        type: integer
      batch_id:
        type: integer
      category:
        type: string
      comment:
        type: string
      date:
        type: string
      field_errors:
        additionalProperties:
          type: string
        type: object
      id:
        type: integer
      row_number:
        type: integer
      specificity:
        type: string
      status:
        type: string
      tag_id:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  dto.MonthCategoryResponse:
    properties:
      amount:
        type: integer
      category_id:
        type: integer
      subcategories:
        items:
          $ref: '#/definitions/dto.MonthSubcategoryResponse'
        type: array
    type: object
  dto.MonthSubcategoryResponse:
    properties:
      all_mandatory:
        type: boolean
      amount:
        type: integer
      subcategory_id:
        type: integer
    type: object
  dto.MonthSummaryResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/dto.MonthCategoryResponse'
        type: array
      days_in_month:
        type: integer
      expense:
        type: integer
      income:
        type: integer
      is_current:
        type: boolean
      month:
        description: YYYY-MM
        type: string
      today:
        type: integer
    type: object
  dto.PlannerRequest:
    properties:
      days:
        type: integer
      incomes:
        items:
          $ref: '#/definitions/domain.PlannerIncome'
        type: array
      payment_overrides:
        additionalProperties:
          type: integer
        type: object
      plans:
        additionalProperties:
          type: integer
        type: object
    type: object
  dto.PlannerResponse:
    properties:
      days:
        type: integer
      incomes:
        items:
          $ref: '#/definitions/domain.PlannerIncome'
        type: array
      payment_overrides:
        additionalProperties:
          type: integer
        type: object
      plans:
        additionalProperties:
          type: integer
        type: object
      updated_at:
        type: string
    type: object
  dto.ReorderPlannedExpenseCategoriesRequest:
    properties:
      ids:
        items:
          type: integer
        type: array
    type: object
  dto.SpendingLimitResponse:
    properties:
      amount:
        type: integer
      category_id:
        type: integer
      id:
        type: integer
      period_end:
        type: string
      period_start:
        type: string
      period_type:
        type: string
      spent:
        type: integer
      tag:
        $ref: '#/definitions/dto.TransactionTag'
      tag_id:
        type: integer
    type: object
  dto.TagParent:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.TransactionTag:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
      parent:
        $ref: '#/definitions/dto.TagParent'
    type: object
  dto.UpdatePlannedExpenseRequest:
    properties:
      category_id:
        type: integer
      cost_kopecks:
        type: integer
      due_date:
        type: string
      new_category:
        $ref: '#/definitions/dto.CreatePlannedExpenseCategoryRequest'
      priority:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  dto.UpsertCategoryLimitRequest:
    properties:
      amount:
        type: integer
    type: object
  dto.YearMonthResponse:
    properties:
      expense:
        type: integer
      income:
        type: integer
      is_current:
        type: boolean
      month:
        description: YYYY-MM
        type: string
    type: object
  dto.YearSummaryResponse:
    properties:
      months:
        items:
          $ref: '#/definitions/dto.YearMonthResponse'
        type: array
      year:
        type: integer
    type: object
info:
  contact: {}
  description: REST API for finAns personal finance admin
  title: finAns API
  version: "1.0"
paths:
  /api/v1/analytics/expenses-calendar:
    get:
      parameters:
      - description: day or month
        in: query
        name: level
        required: true
        type: string
      - description: year
        in: query
        name: year
        required: true
        type: integer
      - description: month (1-12), required for level=day
        in: query
        name: month
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Expenses calendar aggregation
      tags:
      - analytics
  /api/v1/analytics/month:
    get:
      parameters:
      - description: месяц YYYY-MM (не в будущем)
        in: query
        name: month
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MonthSummaryResponse'
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: 'Сводка месяца: доходы, расходы, категории и подкатегории'
      tags:
      - analytics
  /api/v1/analytics/range:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.AnalyticsRangeResponse'
      summary: 'Диапазон данных: первый месяц с операциями, текущий месяц, годы с
        данными'
      tags:
      - analytics
  /api/v1/analytics/year:
    get:
      parameters:
      - description: год
        in: query
        name: year
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.YearSummaryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Доходы и расходы по месяцам года (до текущего месяца)
      tags:
      - analytics
  /api/v1/health:
    get:
      description: Returns service and database connectivity status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Health check
      tags:
      - health
  /api/v1/import/batches:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ImportBatchWithRowsResponse'
      summary: Upload a CSV file for import moderation
      tags:
      - import
  /api/v1/import/batches/{id}/accept:
    post:
      consumes:
      - application/json
      parameters:
      - description: Batch ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            items:
              $ref: '#/definitions/dto.AcceptedTransactionResponse'
            type: array
      summary: Accept multiple ready moderation rows into transactions
      tags:
      - import
  /api/v1/import/batches/{id}/close:
    post:
      parameters:
      - description: Batch ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Close an import batch (discard the moderation session)
      tags:
      - import
  /api/v1/import/batches/active:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ImportBatchWithRowsResponse'
        "204":
          description: No Content
      summary: Get the active (not yet closed) import batch, if any
      tags:
      - import
  /api/v1/import/rows/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Row ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ModerationRowResponse'
      summary: Inline-edit a moderation row
      tags:
      - import
  /api/v1/import/rows/{id}/accept:
    post:
      parameters:
      - description: Row ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.AcceptedTransactionResponse'
      summary: Accept a single ready moderation row into transactions
      tags:
      - import
  /api/v1/planned-expense-categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List planned expense categories
      tags:
      - planned-expense-categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePlannedExpenseCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a planned expense category
      tags:
      - planned-expense-categories
  /api/v1/planned-expense-categories/reorder:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Full ordered list of category IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ReorderPlannedExpenseCategoriesRequest'
      responses:
        "204":
          description: No Content
      summary: Persist a new drag-and-drop order for category cards
      tags:
      - planned-expense-categories
  /api/v1/planned-expenses:
    get:
      parameters:
      - description: active (default) or archived
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: List planned expenses (active grouped by category, or archived flat)
      tags:
      - planned-expenses
    post:
      consumes:
      - application/json
      parameters:
      - description: Item
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePlannedExpenseRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      summary: Create a planned expense item
      tags:
      - planned-expenses
  /api/v1/planned-expenses/{id}:
    delete:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      summary: Delete a planned expense item
      tags:
      - planned-expenses
    patch:
      consumes:
      - application/json
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      - description: Item
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePlannedExpenseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update a planned expense item
      tags:
      - planned-expenses
  /api/v1/planned-expenses/{id}/complete:
    post:
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Mark a planned expense item as done and move it to the archive
      tags:
      - planned-expenses
  /api/v1/planner:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PlannerResponse'
      summary: Планирование проекта (общее для участников)
      tags:
      - planner
    put:
      consumes:
      - application/json
      parameters:
      - description: Состояние планирования
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PlannerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PlannerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      summary: Сохранить планирование проекта (последняя запись побеждает)
      tags:
      - planner
  /api/v1/spending-limits/by-category/{categoryId}:
    delete:
      parameters:
      - description: ID категории верхнего уровня
        in: path
        name: categoryId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Убрать ежемесячный лимит категории
      tags:
      - spending-limits
    put:
      consumes:
      - application/json
      parameters:
      - description: ID категории верхнего уровня
        in: path
        name: categoryId
        required: true
        type: integer
      - description: Сумма в копейках
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.UpsertCategoryLimitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SpendingLimitResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Задать ежемесячный лимит категории (upsert)
      tags:
      - spending-limits
swagger: "2.0"
